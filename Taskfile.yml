version: '3'

tasks:
  build:
    desc: Build the dashboard (BoothItemManager2 Bulk Pipeline)
    cmds:
      - uv run python3 scripts/run_bulk_pipeline.py

  serve:
    desc: Serve the generated site
    cmds:
      - cd dist && python3 -m http.server 8080
    interactive: true

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf dist

  clean-cache:
    desc: Clean metadata cache
    cmds:
      - rm booth_item_cache.json

  lint:
    desc: Lint code
    cmds:
      - uv run ruff check src

  format:
    desc: Format code
    cmds:
      - uv run ruff format src

  test:
    desc: Run tests
    cmds:
      - uv run pytest

  check:
    desc: Run lint, format, and tests
    deps: [lint, format]
    cmds:
      - task: test
