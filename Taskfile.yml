version: '3'

tasks:
  bootstrap:
    desc: Install the exact locked Python environment
    cmds:
      - uv sync --locked

  check:
    desc: Run the non-mutating fast quality gate used by prek and CI
    cmds:
      - uv run --locked python scripts/check.py

  format:
    desc: Apply Ruff formatting explicitly
    cmds:
      - uv run --locked ruff format src scripts tests

  build:
    desc: Build the published dashboard from the checked-in static API
    cmds:
      - mkdir -p dist dist/api
      - python3 scripts/build_ui.py --source index.html --output dist/index.html
      - cp ai-tools.html catalog-ux.css catalog-ux.js catalog-evidence.css catalog-evidence.js kafka-signal.css kafka-signal.js dist/
      - cp api/*.json api/*.js dist/api/ 2>/dev/null || true
      - cp -r api/details dist/api/ 2>/dev/null || true
      - python3 scripts/build_proof.py --api-dir api --output dist/proof.json

  refresh:
    desc: Re-observe a bounded BOOTH slice and update material catalogue changes
    cmds:
      - uv run --locked python scripts/refresh_catalog.py --api-dir api --interval-minutes 15
      - uv run --locked python scripts/audit_static_api.py api --report build/static-api-refresh-audit.json --max-bytes 4500000

  rebuild-data:
    desc: Rebuild derived data from data/raw/index.ndjson when that source dataset is present
    cmds:
      - test -f data/raw/index.ndjson
      - uv run --locked python scripts/run_bulk_pipeline.py

  serve:
    desc: Serve the generated site
    cmds:
      - cd dist && python3 -m http.server 8080
    interactive: true

  mcp-serve:
    desc: Start the Model Context Protocol server for catalogue and SEO metadata
    cmds:
      - uv run --locked python scripts/mcp_seo_server.py

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf dist build

  clean-cache:
    desc: Clean metadata cache
    cmds:
      - rm -f booth_item_cache.json
