<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoothItemManager2 - VRChat Booth Asset Discovery</title>
    <style>
        :root {
            --accent: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.4);
            --bg-deep: #050505;
            --bg-surface: #0f0f0f;
            --bg-card: #151515;
            --text-primary: #fdfdfd;
            --text-secondary: #c0c0c0;
            --text-muted: #606060;
            --border: #222222;
            --font-main: 'Inter', 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --neon-pink: #ff007a;
            --neon-purple: #bc00ff;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--font-main);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            background: linear-gradient(45deg, var(--accent), var(--neon-pink));
            border-radius: 8px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .search-bar {
            flex: 1;
            max-width: 600px;
            margin: 0 2rem;
            position: relative;
        }

        #search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.8rem 1.4rem;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        #search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .db-stat {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .db-stat span {
            color: var(--accent);
        }

        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        aside {
            width: 320px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .filter-section h3 {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .filter-section h3::after {
            content: "+";
            font-size: 1rem;
            color: var(--text-muted);
        }

        .filter-section.expanded h3::after {
            content: "−";
        }

        .filter-content {
            display: none;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-section.expanded .filter-content {
            display: flex;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-tag:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--text-muted);
            transform: translateY(-1px);
        }

        .filter-tag.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .filter-tag.dimension-avatar { border-color: var(--neon-pink); color: var(--neon-pink); }
        .filter-tag.dimension-style { border-color: var(--accent); color: var(--accent); }
        .filter-tag.dimension-season { border-color: var(--neon-purple); color: var(--neon-purple); }

        main {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            background: var(--bg-deep);
            position: relative;
        }

        .context-indicator {
            position: sticky;
            top: 0;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            margin-top: -2rem;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .active-tags-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag-pill {
            background: var(--accent-glow);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tag-pill .remove {
            cursor: pointer;
            opacity: 0.7;
        }

        .tag-pill .remove:hover { opacity: 1; }

        .asset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 2rem;
        }

        .asset-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .asset-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 15px 30px rgba(0, 229, 255, 0.15);
        }

        .asset-thumb-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #1a1a1a;
            position: relative;
            overflow: hidden;
        }

        .asset-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .asset-card:hover .asset-thumb {
            transform: scale(1.1);
        }

        .asset-price-overlay {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--accent);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .asset-info {
            padding: 1.25rem;
        }

        .asset-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .asset-creator {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .asset-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            height: 22px;
            overflow: hidden;
        }

        .asset-tag {
            font-size: 0.7rem;
            background: rgba(255,255,255,0.05);
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .category-badge {
            display: inline-block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 2rem;
        }

        .modal-container {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 1000px;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.2s;
            z-index: 10;
        }

        .modal-close:hover {
            background: rgba(255,0,0,0.2);
            color: #ff4444;
            border-color: #ff4444;
        }

        .modal-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 3rem;
        }

        .modal-thumb {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .modal-info {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.2;
        }

        .modal-similar-section {
            margin-top: 2rem;
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .similar-item {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .similar-item:hover {
            transform: scale(1.05);
        }

        .similar-thumb {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .btn-booth {
            background: var(--accent);
            color: black;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 800;
            text-decoration: none;
            text-align: center;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn-booth:hover {
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin-bottom: 2rem;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #333; }
    </style>
</head>
<body>
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div style="letter-spacing: 4px; font-weight: 800; color: var(--accent);">INITIALIZING SPACE</div>
    </div>

    <header>
        <a href="/" class="logo-container">
            <div class="logo-mark"></div>
            <div class="logo-text">BoothItemManager2</div>
        </a>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="アセット、ショップ、タグを検索...">
        </div>
        <div class="db-stat">DB: <span id="item-count">--</span> ITEMS</div>
    </header>

    <div class="app-container">
        <aside id="filters-aside">
            <div class="filter-section expanded">
                <h3 onclick="toggleSection(this)">CATEGORY</h3>
                <div class="filter-content tag-list" id="cat-filters">
                    <div class="filter-tag active" data-cat="all">ALL</div>
                    <div class="filter-tag" data-cat="avatar">AVATAR</div>
                    <div class="filter-tag" data-cat="outfit">OUTFIT</div>
                    <div class="filter-tag" data-cat="accessory">ACCESSORY</div>
                    <div class="filter-tag" data-cat="gimmick">GIMMICK</div>
                </div>
            </div>

            <!-- Dynamic groups will be inserted here -->
        </aside>

        <main id="main-content">
            <div class="context-indicator">
                <div class="active-tags-row" id="active-tags-row">
                    <!-- Dynamic pills -->
                </div>
                <div class="result-count" id="result-count">Restructuring world...</div>
            </div>
            
            <div id="asset-grid" class="asset-grid"></div>
            <div id="load-more-trigger" style="height: 100px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.8rem; letter-spacing: 2px;">
                END OF STREAM
            </div>
        </main>
    </div>

    <div id="modal-overlay" class="modal-overlay" onclick="closeModal()">
        <div class="modal-container" onclick="event.stopPropagation()">
            <div class="modal-close" onclick="closeModal()">×</div>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        let allItems = [];
        let tagGraph = { nodes: [], edges: [] };
        let filtered = [];
        let displayedCount = 40;
        
        let activeCat = 'all';
        let activeTags = new Set();
        let activeNodeId = null;
        let query = "";

        const grid = document.getElementById('asset-grid');
        const countSpan = document.getElementById('item-count');
        const resCountSpan = document.getElementById('result-count');
        const searchInput = document.getElementById('search-input');
        const activeTagsRow = document.getElementById('active-tags-row');
        const spaceContainer = document.getElementById('space-navigator-container');
        const loadingOverlay = document.getElementById('loading-overlay');

        async function init() {
            try {
                const [resCatalog, resGraph] = await Promise.all([
                    fetch('api/catalog.json'),
                    fetch('api/tag_graph.json')
                ]);
                allItems = await resCatalog.json();
                tagGraph = await resGraph.json();
                
                countSpan.textContent = allItems.length.toLocaleString();
                
                renderTrending();
                applyFilters();
                setupObserver();
                bindEvents();
                
                loadingOverlay.style.opacity = '0';
                setTimeout(() => loadingOverlay.remove(), 500);
            } catch (e) {
                console.error(e);
                grid.innerHTML = '<div class="loading-screen">SYSTEM CRITICAL ERROR: DATABASE OFFLINE</div>';
            }
        }

        function bindEvents() {
            searchInput.addEventListener('input', debounce((e) => {
                query = e.target.value.toLowerCase();
                applyFilters();
            }, 250));

            document.querySelectorAll('#cat-filters .filter-tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    document.querySelectorAll('#cat-filters .filter-tag').forEach(t => t.classList.remove('active'));
                    tag.classList.add('active');
                    activeCat = tag.dataset.cat;
                    applyFilters();
                });
            });

            document.getElementById('trending-nodes').addEventListener('click', (e) => {
                const tag = e.target.closest('.filter-tag');
                if (!tag) return;
                const id = tag.dataset.id;
                toggleTag(id);
            });
        }

        function toggleTag(tagId) {
            if (activeTags.has(tagId)) {
                activeTags.delete(tagId);
                if (activeNodeId === tagId) {
                    activeNodeId = Array.from(activeTags)[activeTags.size - 1] || null;
                }
            } else {
                activeTags.add(tagId);
                activeNodeId = tagId;
            }
            applyFilters();
        }

        function applyFilters() {
            filtered = allItems.filter(item => {
                const itemTags = new Set(item.tags_raw || []);
                (item.targets || []).forEach(t => itemTags.add(t.code));
                
                const matchesText = !query || `${item.title} ${item.creator_name} ${Array.from(itemTags).join(' ')}`.toLowerCase().includes(query);
                const matchesCat = activeCat === 'all' || item.category === activeCat;
                const matchesTags = activeTags.size === 0 || Array.from(activeTags).every(t => itemTags.has(t));
                
                return matchesText && matchesCat && matchesTags;
            });
            
            displayedCount = 40;
            renderGrid();
            renderActiveTags();
            renderSpaceNavigator();
            renderTrending();
            
            resCountSpan.textContent = `LOCATED ${filtered.length.toLocaleString()} ENTITIES`;
            
            // Dynamic theme adjustment
            if (activeNodeId) {
                const node = tagGraph.nodes.find(n => n.tag_id === activeNodeId);
                if (node) {
                    const color = node.dimension === 'avatar' ? '#ff007a' : (node.dimension === 'style' ? '#00e5ff' : '#bc00ff');
                    document.documentElement.style.setProperty('--accent', color);
                }
            } else {
                document.documentElement.style.setProperty('--accent', '#00e5ff');
            }
        }

        function renderGrid() {
            const chunk = filtered.slice(0, displayedCount);
            if (chunk.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; padding: 4rem; text-align: center; color: var(--text-muted); font-size: 1.2rem; font-weight: 800; letter-spacing: 2px;">VOID DETECTED: NO ENTITIES MATCH YOUR SIGNATURE</div>';
                return;
            }
            grid.innerHTML = chunk.map(item => `
                <a href="${item.source_url}" target="_blank" class="asset-card">
                    <div class="asset-thumb-container">
                        <img src="${item.thumbnail_url}" class="asset-thumb" loading="lazy" onerror="this.src='https://via.placeholder.com/250x250?text=SIGNAL+LOST'">
                        <div class="asset-price-overlay">¥${(item.price || 0).toLocaleString()}</div>
                    </div>
                    <div class="asset-info">
                        <div class="category-badge">${item.category}</div>
                        <div class="asset-title" title="${item.title}">${item.title}</div>
                        <div class="asset-creator">@${item.creator_name}</div>
                        <div class="asset-tags">
                            ${(item.tags_raw || []).slice(0, 3).map(t => `<span class="asset-tag">${t}</span>`).join('')}
                        </div>
                    </div>
                </a>
            `).join('');
        }

        function renderActiveTags() {
            activeTagsRow.innerHTML = Array.from(activeTags).map(t => `
                <div class="tag-pill">
                    ${t} <span class="remove" onclick="event.stopPropagation(); toggleTag('${t}')">×</span>
                </div>
            `).join('');
        }

        function renderSpaceNavigator() {
            if (!activeNodeId) {
                spaceContainer.innerHTML = `
                    <div style="padding: 1rem; color: var(--text-muted); font-size: 0.85rem; border: 1px dashed var(--border); border-radius: 12px; text-align: center;">
                        SELECT A NODE TO ENTER STATE SPACE
                    </div>
                `;
                return;
            }

            const node = tagGraph.nodes.find(n => n.tag_id === activeNodeId);
            const neighbors = tagGraph.edges
                .filter(e => e.source_id === activeNodeId || e.target_id === activeNodeId)
                .map(e => {
                    const neighborId = e.source_id === activeNodeId ? e.target_id : e.source_id;
                    const neighborNode = tagGraph.nodes.find(n => n.tag_id === neighborId);
                    return { ...neighborNode, strength: e.strength };
                })
                .sort((a, b) => b.strength - a.strength)
                .slice(0, 8);

            spaceContainer.innerHTML = `
                <div class="space-navigator">
                    <div class="current-node">
                        ${activeNodeId} <small>${node ? node.dimension : ''}</small>
                    </div>
                    <div style="font-size: 0.65rem; color: var(--text-muted); margin-bottom: 1rem; letter-spacing: 1px;">NEIGHBORING SPACES</div>
                    <div class="neighbor-list">
                        ${neighbors.map(n => `
                            <div class="neighbor-item" onclick="toggleTag('${n.tag_id}')">
                                <span style="color: ${n.tag_id === activeNodeId ? 'var(--accent)' : 'var(--text-secondary)'}">${n.tag_id}</span>
                                <div class="strength-bar">
                                    <div class="strength-fill" style="width: ${Math.min(100, n.strength * 500)}%"></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderTrending() {
            const sortedNodes = [...tagGraph.nodes].sort((a, b) => b.weight - a.weight).slice(0, 30);
            document.getElementById('trending-nodes').innerHTML = sortedNodes.map(n => {
                const isActive = activeTags.has(n.tag_id);
                return `
                    <div class="filter-tag dimension-${n.dimension} ${isActive ? 'active' : ''}" data-id="${n.tag_id}">
                        ${n.tag_id}
                    </div>
                `;
            }).join('');
        }

        function setupObserver() {
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && displayedCount < filtered.length) {
                    displayedCount += 60;
                    renderGrid();
                }
            }, { root: null, rootMargin: '400px' });
            observer.observe(document.getElementById('load-more-trigger'));
        }

        function debounce(fn, ms) {
            let t;
            return (...args) => {
                clearTimeout(t);
                t = setTimeout(() => fn(...args), ms);
            };
        }

        init();
    </script>
</body>
</html>
