# [AXIOM] Ontology for VRChat Avatar Modification Ecosystem
# Derived from: VRChat Docs, BOOTH Conventions, Note Tech-reviews, and Tool specifications (MA/VRCFury).

options:
  case_insensitive: true
  unicode_normalization: "NFKC"
  trim_whitespace: true

# 1. Base Avatars (The core of the ecosystem)
# items are indexed by canonical code. item_id is MUST for ID-based discovery.
