# 2. Asset Categories (Ontology of Modification)
# Based on VRChat component structure and BOOTH usage.
categories:
  AVATAR:
    aliases: ["アバター", "avatar", "3Dキャラクター", "オリジナル3Dモデル"]
    indicators: ["original avatar", "オリジナルアバター"]
  OUTFIT:
    aliases: ["衣装", "服", "outfit", "costume", "dress", "着せ替え", "clothing"]
    sub_categories: ["tops", "bottoms", "inner", "outer", "set"]
  ACCESSORY:
    aliases: ["アクセサリ", "accessory", "小物", "item", "prop"]
    sub_categories: ["head", "face", "ear", "hand", "foot", "weapon"]
  HAIRSTYLE:
    aliases: ["髪型", "ヘアスタイル", "hairstyle", "hair", "髪", "ウィッグ"]
  TEXTURE:
    aliases: ["テクスチャ", "texture", "skin", "makeup", "eye texture", "body texture", "瞳", "肌", "メイク"]
  GIMMICK_TOOL:
    aliases: ["ギミック", "gimmick", "tool", "システム", "system", "script", "MA対応", "VRCFury"]
    features: ["Modular Avatar", "VRCFury", "PhysBone", "Expression Menu"]

# 3. Technical Specs (Features for filtering)
features:
  ModularAvatar:
    aliases: ["Modular Avatar", "MA対応", "MA", "ModularAvatar"]
  VRCFury:
    aliases: ["VRCFury", "Fury"]
  PhysBone:
    aliases: ["PhysBone", "PB対応", "PB", "揺れもの"]
  QuestCompatible:
    aliases: ["Quest対応", "Android対応", "Quest", "Android"]
  lilToon:
    aliases: ["lilToon", "lil"]
  Poiyomi:
    aliases: ["Poiyomi", "Poi"]

# 4. Visual Styles (Mood/Taste Ontology)
styles:
  Street: ["ストリート", "street", "カジュアル", "casual"]
  Gothic: ["ゴシック", "gothic", "ゴス"]
  Lolita: ["ロリータ", "lolita", "甘ロリ", "黒ロリ"]
  Cyber: ["サイバー", "cyber", "テックウェア", "techwear"]
  Japanese: ["和風", "japanese", "和装", "着物", "浴衣"]
  Fantasy: ["ファンタジー", "fantasy", "魔道士", "騎士"]
  Military: ["ミリタリー", "military", "軍服"]
  Jirai: ["地雷", "地雷系", "jirai"]
  Tenshi: ["天使", "angel", "サブカル"]

# 5. Technical Elements (Granular Components)
components:
  Mesh: ["メッシュ", "mesh"]
  Bone: ["ボーン", "bone", "アーマチュア", "armature"]
  Material: ["マテリアル", "material", "mat"]
  Shader: ["シェーダー", "shader"]
  BlendShape: ["ブレンドシェイプ", "blendshape", "シェイプキー", "shapekey"]
  Animation: ["アニメーション", "animation", "anim"]
  ExpressionMenu: ["expression menu", "エクスプレッションメニュー", "exメニュー"]
