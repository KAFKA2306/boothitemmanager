name: Build, Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Fast non-mutating quality gate
        run: uv run --locked python scripts/check.py

      - name: Validate ontology tags
        run: |
          uv run --locked python - <<'PY'
          import re
          import yaml

          with open("ontology/tags.yaml", encoding="utf-8") as file:
              data = yaml.safe_load(file)

          pattern = re.compile(r"^[0-9]+(アバター|avatars|avatar|人|モデル)", re.I)
          failures = []
          for section, tags in data.items():
              if not isinstance(tags, dict):
                  continue
              failures.extend(f"{section}/{tag}" for tag in tags if pattern.match(tag))

          if failures:
              raise SystemExit(f"numeric compatibility-style tags are not allowed: {failures}")
          PY

      - name: Validate browser JavaScript syntax
        run: |
          node --check catalog-ux.js
          node --check catalog-evidence.js
          node --check kafka-signal.js

      - name: Install Playwright Chromium
        run: uv run --locked playwright install --with-deps chromium

      - name: Build static site
        run: |
          mkdir -p dist
          uv run --locked python scripts/build_ui.py --source index.html --output dist/index.html
          cp ai-tools.html catalog-ux.css catalog-ux.js catalog-evidence.css catalog-evidence.js kafka-signal.css kafka-signal.js dist/
          mkdir -p dist/api
          if [ -d api ]; then
            cp api/*.json api/*.js dist/api/ 2>/dev/null || true
          fi
          if [ -d api/details ]; then
            cp -r api/details dist/api/
          fi
          uv run --locked python scripts/build_proof.py --api-dir api --output dist/proof.json

      - name: Browser integration tests
        run: uv run --locked pytest tests/e2e -v

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-gh-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cf-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: github-pages
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: dist-archive

      - name: Extract artifact
        run: |
          mkdir -p dist
          tar -xf dist-archive/artifact.tar -C dist/

      - name: Deploy to Cloudflare Pages
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=boothitemmanager

  cleanup-merged-branches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete merged repository branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              per_page: 100,
            });
            for (const pull of pulls) {
              const branch = pull.head?.ref;
              const sameRepository = pull.head?.repo?.full_name === `${owner}/${repo}`;
              if (!pull.merged_at || !sameRepository || !branch || branch === 'main') continue;
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                core.info(`Deleted merged branch: ${branch}`);
              } catch (error) {
                if (![404, 422].includes(error.status)) throw error;
                core.info(`Branch already absent or protected: ${branch}`);
              }
            }
