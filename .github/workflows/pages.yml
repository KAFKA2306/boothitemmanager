name: Build, Test and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          node-version-file: .node-version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and Playwright
        run: |
          pip install uv
          uv venv
          source .venv/bin/activate
          uv pip install pytest pytest-playwright pytest-asyncio requests pydantic
          uv run playwright install --with-deps chromium

      - name: Build static site
        run: |
          mkdir -p dist
          cp index.html dist/
          mkdir -p dist/api
          if [ -d api ]; then
            cp api/*.json dist/api/ 2>/dev/null || true
          fi
          if [ -d api/details ]; then
            cp -r api/details dist/api/
          fi
          echo '{"items": 40317, "updated_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}' > dist/proof.json

      - name: Run E2E Tests
        run: |
          source .venv/bin/activate
          uv run pytest tests/e2e/test_browser.py -v

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-gh-pages:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cf-pages:
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: dist-archive
          
      - name: Extract artifact
        run: |
          mkdir -p dist
          tar -xf dist-archive/artifact.tar -C dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=boothitemmanager
