name: Build, Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and Playwright
        run: |
          pip install uv
          uv venv
          source .venv/bin/activate
          uv pip install pytest pytest-playwright pytest-asyncio requests beautifulsoup4 pydantic pyyaml
          uv run playwright install --with-deps chromium

      - name: Build static site
        run: bash build_static.sh

      - name: Validate ontology tags
        run: |
          uv run python - <<'PY'
          import re
          import yaml

          with open("ontology/tags.yaml", encoding="utf-8") as file:
              data = yaml.safe_load(file)

          pattern = re.compile(r"^[0-9]+(アバター|avatars|avatar|人|モデル)", re.I)
          failures = []
          for section, tags in data.items():
              if not isinstance(tags, dict):
                  continue
              failures.extend(f"{section}/{tag}" for tag in tags if pattern.match(tag))

          if failures:
              raise SystemExit(f"numeric compatibility-style tags are not allowed: {failures}")
          PY

      - name: Validate static sources
        run: |
          python -m py_compile \
            scripts/build_ui.py \
            scripts/build_proof.py \
            scripts/build_seller_market_report.py \
            scripts/build_static_distribution.py \
            scripts/refresh_catalog.py \
            src/boothitemmanager2/freshness.py \
            src/boothitemmanager2/crawler.py \
            tests/test_catalog_ui.py \
            tests/test_build_proof.py \
            tests/test_build_static_distribution.py \
            tests/test_seller_market_report.py \
            tests/test_freshness.py \
            tests/test_refresh_catalog.py \
            tests/test_crawler_cache.py
          node --check catalog-ux.js
          node --check catalog-evidence.js
          node --check kafka-signal.js
          uv run pytest \
            tests/test_catalog_ui.py \
            tests/test_build_proof.py \
            tests/test_build_static_distribution.py \
            tests/test_seller_market_report.py \
            tests/test_freshness.py \
            tests/test_refresh_catalog.py \
            tests/test_crawler_cache.py \
            tests/test_ai_tool_detector.py \
            tests/e2e/test_browser.py -v

      - name: Verify canonical runtime payload
        run: |
          test -s dist/api/metadata.json
          test -s dist/api/v1/manifest.json
          test -s dist/api/v1/shards.json
          ! grep -Fq 'window.BOOTH_METADATA' dist/index.html
          ! grep -Fq 'window.BOOTH_CATALOG_PART1' dist/index.html
          ! grep -Fq 'fallback script' dist/index.html
          ! grep -Fq 'DATABASE OFFLINE (CORS)' dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-gh-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify GitHub Pages mirror
        run: |
          root_html="$(curl --fail --silent --show-error https://kafka2306.github.io/boothitemmanager/)"
          report_html="$(curl --fail --silent --show-error https://kafka2306.github.io/boothitemmanager/seller/market-report/)"
          printf '%s' "$root_html" | grep -Fq 'BoothItemManager2'
          printf '%s' "$root_html" | grep -Fq "fetch('api/v1/shards.json')"
          ! printf '%s' "$root_html" | grep -Fq 'window.BOOTH_METADATA'
          printf '%s' "$report_html" | grep -Fq 'BOOTH販売者向け市場レポート'
          curl --fail --silent --show-error --output /dev/null https://kafka2306.github.io/boothitemmanager/api/metadata.json
          curl --fail --silent --show-error --output /dev/null https://kafka2306.github.io/boothitemmanager/api/v1/shards.json
          curl --fail --silent --show-error --output /dev/null https://kafka2306.github.io/boothitemmanager/api/seller_market_report.json

  cleanup-merged-branches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete merged repository branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              per_page: 100,
            });
            for (const pull of pulls) {
              const branch = pull.head?.ref;
              const sameRepository = pull.head?.repo?.full_name === `${owner}/${repo}`;
              if (!pull.merged_at || !sameRepository || !branch || branch === 'main') continue;
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                core.info(`Deleted merged branch: ${branch}`);
              } catch (error) {
                if (![404, 422].includes(error.status)) throw error;
                core.info(`Branch already absent or protected: ${branch}`);
              }
            }
