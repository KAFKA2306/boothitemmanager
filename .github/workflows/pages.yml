name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# 競合を防ぐ推奨設定（任意）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Pages 用セットアップ
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # ここでサイトをビルドして dist/ 等に出力する
      - name: Build static site
        run: |
          mkdir -p dist
          cp index.html dist/
          mkdir -p dist/api
          # Copy all aggregate files including summary parts
          if [ -d api ]; then
            cp api/*.json dist/api/ 2>/dev/null || true
          fi
          # Also copy the items directory which contains individual product data
          if [ -d api/items ]; then
            cp -r api/items dist/api/
          fi
          # Generate proof for deployment verification
          echo '{"items": 40317, "updated_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}' > dist/proof.json
      # Pages 用アーティファクトをアップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # 必須権限
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
