name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# 競合を防ぐ推奨設定（任意）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Pages 用セットアップ
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # ここでサイトをビルドして dist/ 等に出力する
      - name: Build static site
        run: |
          mkdir -p dist
          cp index.html dist/
          if [ -d api ]; then cp -r api dist/; fi
          if [ -d data ]; then 
            mkdir -p dist/data/structured
            cp data/structured/catalog.json dist/data/structured/ || echo "No catalog yet"
          fi
          # Generate proof for deployment verification
          python3 generate_proof.py > dist/proof.json || echo "{}" > dist/proof.json
      # Pages 用アーティファクトをアップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # 必須権限
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
