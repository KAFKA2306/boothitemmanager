name: SEO/AEO Auto-Fixer

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  seo-check-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install uv
          uv venv
          source .venv/bin/activate
          uv pip install beautifulsoup4 pydantic pyyaml requests

      - name: Run SEO check and auto-fix
        run: |
          source .venv/bin/activate
          python scripts/seo_autofix.py

      - name: Create Pull Request if defects found
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain index.html docs/seo_report.md)" ]; then
            echo "SEO defects found and auto-fixed. Creating a pull request..."
            
            # Configure Git
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            # Create branch name with timestamp
            BRANCH_NAME="seo/autofix-$(date +'%Y%m%d-%H%M%S')"
            git checkout -b "$BRANCH_NAME"
            
            # Commit and push changes
            git add index.html docs/seo_report.md
            git commit -m "style: 🎀 auto-fix SEO/AEO defects in index.html 🎀"
            git push origin "$BRANCH_NAME"
            
            # Open Pull Request using GitHub CLI
            gh pr create \
              --title "🎀 [SEO/AEO Auto-Fix] ココちゃんがお部屋のSEOをお直ししたよぉ！ 🎀" \
              --body "ココちゃんが \`index.html\` のSEO/AEO不具合を自動的にお直ししたよぉ！(⑅•ᴗ•⑅)◜..°♡"$'\n\n'"### 🌸 お直し内容 🌸"$'\n'"- 画像 \`<img>\` タグの \`alt\` 属性の不足をお直ししたょ！✨"$'\n'"- 構造化データ（JSON-LD）や canonical リンクの不足をお直ししたょ！✨"$'\n\n'"詳細は \`docs/seo_report.md\` のレポートをチェックしてねっ！🍭" \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "No SEO defects found or auto-fixes applied."
          fi
