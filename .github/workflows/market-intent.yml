name: Autonomous market intent

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "scripts/build_market_opportunities.py"
      - ".github/workflows/market-intent.yml"
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: autonomous-market-intent
  cancel-in-progress: true

jobs:
  select-intent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate intent generator
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile scripts/build_market_opportunities.py tests/test_market_opportunities.py
          pytest tests/test_market_opportunities.py -q

      - name: Derive current market intent
        id: intent
        run: |
          mkdir -p build
          python scripts/build_market_opportunities.py \
            --api-dir api \
            --output build/market-opportunities.json \
            --issue-output build/market-intent.md

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("build/market-opportunities.json").read_text(encoding="utf-8")
          )
          selected = payload.get("selected_intent")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_selected={'true' if selected else 'false'}\n")
              if selected:
                  output.write(f"key={selected['key']}\n")
                  output.write(f"category={selected['category']}\n")
                  output.write(f"avatar={selected['avatar']}\n")
          PY

      - name: Create or update canonical market-intent issue
        if: steps.intent.outputs.has_selected == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          INTENT_CATEGORY: ${{ steps.intent.outputs.category }}
          INTENT_AVATAR: ${{ steps.intent.outputs.avatar }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- autonomous-market-intent -->';
            const body = fs.readFileSync('build/market-intent.md', 'utf8');
            const title = `Market intent: ${process.env.INTENT_AVATAR} × ${process.env.INTENT_CATEGORY}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const current = issues.find(issue =>
              !issue.pull_request && (issue.body || '').includes(marker)
            );

            if (!current) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.notice(`created autonomous market intent issue #${created.data.number}`);
              return;
            }

            if (current.state === 'open' && current.title === title && current.body === body) {
              core.notice(`market intent unchanged; issue #${current.number} remains canonical`);
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: current.number,
              title,
              body,
              state: 'open',
            });
            core.notice(`updated autonomous market intent issue #${current.number}`);
