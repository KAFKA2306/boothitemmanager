name: Bootstrap quality lock

on:
  push:
    branches: [chore/quality-gates]
    paths:
      - "pyproject.toml"
      - ".python-version"
      - ".github/workflows/bootstrap-quality-lock.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-quality-lock
  cancel-in-progress: true

jobs:
  lock-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/quality-gates
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv python install 3.12
      - name: Resolve lock and format maintained Python
        run: |
          uv lock
          uv sync --locked
          uv run --locked ruff format src scripts tests
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/refresh_catalog.py')
          text = path.read_text(encoding='utf-8')
          old = '''from dataclasses import dataclass\n'''
          new = '''from pydantic import BaseModel, ConfigDict\n'''
          if old not in text and new not in text:
              raise SystemExit('refresh_catalog import contract changed')
          text = text.replace(old, new, 1)
          old_class = '''@dataclass\nclass Observation:\n'''
          new_class = '''class Observation(BaseModel):\n    model_config = ConfigDict(strict=True)\n\n'''
          if old_class not in text and new_class not in text:
              raise SystemExit('Observation contract changed')
          text = text.replace(old_class, new_class, 1)
          path.write_text(text, encoding='utf-8')
          PY
          uv run --locked ruff format scripts/refresh_catalog.py
      - name: Commit resolver output and mechanical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock src scripts tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: resolve uv lock and normalize Python formatting"
          git push origin HEAD:chore/quality-gates
