name: Agent Verification Harness

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  agent-harness-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          
      - name: Run Harness Smoke Test
        run: |
          # Verify that the verification loop logic is sound
          python3 scripts/demo_harness.py
          
      - name: Run Evolving Ontology Audit
        run: |
          # Practical application: Audit current ontology health
          export PYTHONPATH=$PYTHONPATH:src
          python3 -c "
          from boothitemmanager2.agent_harness import PostToolHarness, CICDHarness
          import yaml
          import os
          
          def audit_ontology():
              with open('ontology/tags.yaml', 'r') as f:
                  data = yaml.safe_load(f)
              # Check for forbidden patterns (Numerical tags)
              import re
              BAD_PATTERN = re.compile(r'^[0-9]+(アバター|avatars|avatar|人|モデル)', re.I)
              failures = []
              for section, tags in data.items():
                  if not isinstance(tags, dict): continue
                  for t in tags:
                      if BAD_PATTERN.match(t):
                          failures.append(f'{section}/{t}')
              return {'clean': len(failures) == 0, 'bad_tags': failures}

          def verify_audit(res, args):
              return {'clean': res['clean'], 'fail_count': len(res['bad_tags'])}

          block = PostToolHarness.execute(
              trace_id='ci_audit',
              action_name='ontology_cleanliness_check',
              action_fn=audit_ontology,
              action_args={},
              expected_state={'clean': True, 'fail_count': 0},
              verifier_fn=verify_audit
          )
          
          report = CICDHarness.run_suite('Ontology Health Suite', [block])
          if report['summary']['failed'] > 0:
              exit(1)
          "
